name: Build and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/runpod-comfyui-minimax-h3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate source tree
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f requirements.lock.txt
          test -f worker/handler.py
          test -f custom_nodes/minimax_h3_flref_audio.py
          python -m json.tool workflows/minimax_h3_r2va_api_1344x768.json >/dev/null
          python -m py_compile worker/handler.py
          python -m unittest discover -s tests
          if find . -type f \( -name '*.safetensors' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.mp4' -o -name '*.png' \) -print -quit | grep -q .; then
            echo 'Forbidden model/media file found in Docker source' >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Inspect published image
        id: inspect
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          index_json="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          if jq -e '.manifests' >/dev/null <<<"$index_json"; then
            platform_digest="$(
              jq -r '
                .manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "amd64")
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest
              ' <<<"$index_json" | head -n 1
            )"
            test -n "$platform_digest"
            manifest_json="$(
              docker buildx imagetools inspect --raw \
                "${REGISTRY}/${IMAGE_NAME}@${platform_digest}"
            )"
          else
            platform_digest='${{ steps.build.outputs.digest }}'
            manifest_json="$index_json"
          fi
          compressed_bytes="$(jq '[.config.size, (.layers[].size)] | add' <<<"$manifest_json")"
          test "$compressed_bytes" -gt 0
          compressed_size="$(numfmt --to=iec-i --suffix=B "$compressed_bytes")"
          echo "platform_digest=$platform_digest" >> "$GITHUB_OUTPUT"
          echo "compressed_bytes=$compressed_bytes" >> "$GITHUB_OUTPUT"
          echo "compressed_size=$compressed_size" >> "$GITHUB_OUTPUT"

      - name: Publish build summary
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Index digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'linux/amd64 digest: `${{ steps.inspect.outputs.platform_digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compressed registry payload: `${{ steps.inspect.outputs.compressed_size }}` (`${{ steps.inspect.outputs.compressed_bytes }}` bytes)' >> "$GITHUB_STEP_SUMMARY"
